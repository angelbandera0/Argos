      aria: on ? 'true' : 'false', toggle: () => this.setState({ sel: Object.assign({}, st.sel, { [d[0]]: !on }) }),
      btnLabel: on ? 'En la solicitud' : 'Solicitar', btnIcon: on ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14',
      btn: 'height: 40px; padding: 0 14px; border-radius: 9999px; font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; ' + (on ? 'background: #d92d25; color: #ffffff; border: 0' : 'background: #ffffff; color: #1c1c1e; border: 1.5px solid #d6d9de')
    }; });
    const estados = [['todos', 'Todos', base.length], ['bajo', 'Bajos', base.filter((d) => stOf(d) === 'bajo').length], ['agotado', 'Agotados', base.filter((d) => stOf(d) === 'agotado').length]].map(([id, label, count]) => { const on = st.est === id; return {
      label, count: String(count), hasCount: true, aria: on ? 'true' : 'false', pick: () => this.setState({ est: id }),

      countStyle: 'min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (on ? 'background: #ffffff' : 'background: #f6f8fa') }; });
    const cats = ['Todas', 'Granos', 'Aceites', 'Bebidas', 'Lácteos', 'Panadería'].map((c) => { const on = st.cat === c; return { label: c, aria: on ? 'true' : 'false', pick: () => this.setState({ cat: c }),
      style: 'height: 36px; padding: 0 14px; border-radius: 9999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 0; ' + (on ? 'background: #1c1c1e; color: #ffffff' : 'background: #f6f8fa; color: #45484d') }; });
    const n = Object.keys(st.sel).filter((k) => st.sel[k]).length;
    const V = { items, estados, cats, query: st.query, onQuery: (e) => this.setState({ query: e.target.value }), empty: !items.length,
      clear: () => this.setState({ query: '', est: 'todos', cat: 'Todas' }),
      hasOut: out.length > 0, outTitle: out.length + (out.length === 1 ? ' producto agotado' : ' productos agotados'), outNames: out.map((d) => d[1]).join(' y '),
      selOut: () => { const s = Object.assign({}, st.sel); out.forEach((d) => { s[d[0]] = true; }); this.setState({ sel: s }); },
      hasSel: n > 0, selLabel: 'Solicitar reposición · ' + n + (n === 1 ? ' producto' : ' productos') };

    return Object.assign(COMMON, V);
  }
