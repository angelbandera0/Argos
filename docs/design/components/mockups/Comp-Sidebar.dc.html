<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Componentes · Secciones del sidebar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#d92d25}a:hover{color:#b3221b}
.nav-i:hover{background:#eceef1}
.sec-h:hover{color:#1c1c1e}
</style>
</helmet>
<div style="width: 1200px; height: 1120px; box-sizing: border-box; padding: 48px; background: #ffffff; color: #1c1c1e; font-family: Inter, Arial, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; gap: 28px">

<header>
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #6b6f76">COMPONENTES · ARGOS</p>
<h1 style="margin: 6px 0 0; font-family: 'Inter Tight', Arial, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -1.2px; line-height: 1.1">Secciones del sidebar</h1>
</header>

<div style="display: flex; gap: 28px; flex: 1; min-height: 0">

<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #6b6f76">EXPANDIDO</p>
<aside style="width: 268px; flex: 1; box-sizing: border-box; background: #f6f8fa; border-radius: 28px; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9999px; border: 3px solid #ff443b; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #ff443b"></span></span>
<span style="font-family: 'Inter Tight', Arial, sans-serif; font-weight: 600; font-size: 18px">Argos</span>
</div>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar en el menú</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#45484d" stroke-width="2.2" stroke-linecap="round" style="position: absolute; left: 14px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="Buscar" style="width: 100%; height: 40px; box-sizing: border-box; border: 0; border-radius: 9999px; background: #ffffff; padding: 0 44px 0 38px; font: inherit; font-size: 14px; color: #1c1c1e">
<span aria-hidden="true" style="position: absolute; right: 12px; font-size: 11px; font-weight: 600; color: #6b6f76">⌘K</span>
</label>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{secA}}" as="sec" hint-placeholder-count="3">
<div>
<p style="margin: 0 0 6px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #6b6f76">{{sec.label}}</p>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<a href="#" aria-current="{{it.current}}" class="{{it.cls}}" style="{{it.style}}">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d1}}"></path><path d="{{it.d2}}"></path><path d="{{it.d3}}"></path></svg>
<span style="flex: 1">{{it.label}}</span>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{it.badgeStyle}}">{{it.badge}}</span></sc-if>
<sc-if value="{{it.active}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 9999px; background: #ff443b"></span></sc-if>
</a>
</sc-for>
</div>
</div>
</sc-for>
</nav>
<button type="button" style="margin-top: auto; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 0; border-radius: 9999px; background: transparent; color: #45484d; font: inherit; font-weight: 500; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path></svg>Contraer menú</button>
</aside>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #6b6f76">CON SUBMENÚ Y SECCIONES PLEGABLES <span style="font-weight: 500; letter-spacing: 0">(pruébalo)</span></p>
<aside style="width: 268px; flex: 1; box-sizing: border-box; background: #f6f8fa; border-radius: 28px; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 4px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9999px; border: 3px solid #ff443b; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #ff443b"></span></span>
<span style="font-family: 'Inter Tight', Arial, sans-serif; font-weight: 600; font-size: 18px">Argos</span>
</div>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{secB}}" as="sec" hint-placeholder-count="3">
<div>
<button type="button" aria-expanded="{{sec.aria}}" onClick="{{sec.toggle}}" class="sec-h" style="width: 100%; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; background: transparent; color: #6b6f76; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 1px; cursor: pointer">
<span>{{sec.label}}<sc-if value="{{sec.showHidden}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; letter-spacing: 0; font-weight: 500">· {{sec.count}}</span></sc-if></span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{sec.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{sec.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<div>
<sc-if value="{{it.isParent}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-expanded="{{it.aria}}" onClick="{{it.toggle}}" class="nav-i" style="{{it.style}}">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d1}}"></path><path d="{{it.d2}}"></path><path d="{{it.d3}}"></path></svg>
<span style="flex: 1; text-align: left">{{it.label}}</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{it.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px; padding-left: 36px">
<span aria-hidden="true" style="position: absolute; left: 23px; top: 6px; bottom: 6px; width: 1.5px; border-radius: 2px; background: #e4e6ea"></span>
<sc-for list="{{it.children}}" as="ch" hint-placeholder-count="4">
<a href="#" aria-current="{{ch.current}}" onClick="{{ch.pick}}" class="{{ch.cls}}" style="{{ch.style}}">{{ch.label}}<sc-if value="{{ch.active}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="margin-left: auto; width: 7px; height: 7px; border-radius: 9999px; background: #ff443b"></span></sc-if></a>
</sc-for>
</div>
</sc-if>
</sc-if>
<sc-if value="{{it.isLeaf}}" hint-placeholder-val="{{ true }}">
<a href="#" class="nav-i" style="{{it.style}}">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d1}}"></path><path d="{{it.d2}}"></path><path d="{{it.d3}}"></path></svg>
<span style="flex: 1">{{it.label}}</span>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{it.badgeStyle}}">{{it.badge}}</span></sc-if>
</a>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; background: #ffffff; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 10px">
<span style="height: 22px; padding: 0 8px; border-radius: 9999px; background: #ffc93c; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; display: inline-flex; align-items: center">ABIERTA</span>
<span style="flex: 1; font-size: 13px; font-weight: 600">Caja 1</span>
<span style="font-family: 'Inter Tight', Arial, sans-serif; font-weight: 600">$2.868</span>
</div>
</aside>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #6b6f76">COLAPSADO</p>
<div style="position: relative; flex: 1; display: flex">
<nav aria-label="Principal" style="width: 84px; box-sizing: border-box; background: #f6f8fa; border-radius: 28px; padding: 22px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9999px; border: 3px solid #ff443b; box-sizing: border-box; display: flex; align-items: center; justify-content: center; margin-bottom: 12px"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #ff443b"></span></span>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="9">
<sc-if value="{{r.divider}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 28px; height: 1.5px; border-radius: 2px; background: #e4e6ea; margin: 6px 0"></span></sc-if>
<a href="#" aria-label="{{r.label}}" aria-current="{{r.current}}" class="{{r.cls}}" style="{{r.style}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path><path d="{{r.d3}}"></path></svg>
<sc-if value="{{r.hasDot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 9999px; background: #ff443b; box-shadow: 0 0 0 2px #f6f8fa"></span></sc-if>
</a>
</sc-for>
<button type="button" aria-label="Expandir menú" style="margin-top: auto; width: 44px; height: 44px; border: 0; border-radius: 9999px; background: #ffffff; color: #45484d; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"></path></svg></button>
</nav>
<div role="tooltip" style="position: absolute; left: 92px; top: 247px; white-space: nowrap; background: #ffffff; border: 1px solid #eceef1; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(28,28,30,0.12)">Inventario <span style="font-weight: 500; color: #b3221b">· 3 alertas</span></div>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #6b6f76">ANATOMÍA</p>
<div style="flex: 1; border: 1px solid #eceef1; border-radius: 24px; padding: 6px 20px">
<sc-for list="{{anatomy}}" as="a" hint-placeholder-count="7">
<div style="padding: 12px 0; border-bottom: 1px solid #eceef1">
<p style="margin: 0; font-weight: 600">{{a.t}}</p>
<p style="margin: 2px 0 0; font-size: 13px; color: #45484d">{{a.d}}</p>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: { menu: true, gestion: false, config: false }, prodOpen: true, child: 'catalogo' };
  }
  renderVals() {
    const st = this.state;
    const I = {
      panel: ['M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z', '', ''],
      ventas: ['M6 3h12v18l-3-2-3 2-3-2-3 2z', 'M9 8h6M9 12h6', ''],
      productos: ['M21 8l-9-5-9 5 9 5 9-5z', 'M3 8v8l9 5 9-5V8', 'M12 13v8'],
      inventario: ['M4 7h16M4 12h16M4 17h10', '', ''],
      clientes: ['M9 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z', 'M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5', 'M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2'],
      promos: ['M3 12V4h8l10 10-8 8z', 'M7.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z', ''],
      reportes: ['M4 20V10M10 20V4M16 20v-7M22 20H2', '', ''],
      ajustes: ['M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12', 'M16 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM18 16a2 2 0 1 1 0 4 2 2 0 0 1 0-4z', ''],
      ayuda: ['M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z', 'M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7', 'M12 17v.01']
    };
    const badgeStyles = {
      count: 'min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 9999px; background: #d92d25; color: #ffffff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center',
      alert: 'min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 9999px; background: #ffe6e4; color: #b3221b; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center',
      nuevo: 'height: 22px; padding: 0 8px; border-radius: 9999px; background: #ffc93c; color: #1c1c1e; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; display: inline-flex; align-items: center'
    };
    const itemBase = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 9999px; text-decoration: none; font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; border: 0; cursor: pointer; ';
    const mkItem = (key, label, active, badge, kind) => ({
      label, d1: I[key][0], d2: I[key][1], d3: I[key][2], active: !!active, current: active ? 'page' : 'false',
      cls: active ? '' : 'nav-i', hasBadge: !!badge, badge: badge || '', badgeStyle: badgeStyles[kind] || '',
      iconColor: active ? '#d92d25' : 'currentColor',
      style: itemBase + (active ? 'background: #ffffff; color: #1c1c1e; font-weight: 600; box-shadow: 0 1px 2px rgba(28,28,30,0.05), 0 6px 16px rgba(28,28,30,0.06)' : 'background: transparent; color: #45484d; font-weight: 500')
    });
    const secA = [
      { label: 'MENÚ', items: [mkItem('panel', 'Panel', true), mkItem('ventas', 'Ventas', false, '12', 'count'), mkItem('productos', 'Productos'), mkItem('inventario', 'Inventario', false, '3', 'alert')] },
      { label: 'GESTIÓN', items: [mkItem('clientes', 'Clientes'), mkItem('promos', 'Promociones', false, 'NUEVO', 'nuevo'), mkItem('reportes', 'Reportes')] },
      { label: 'CONFIGURACIÓN', items: [mkItem('ajustes', 'Ajustes'), mkItem('ayuda', 'Ayuda')] }
    ];
    const chev = (open) => 'transition: transform 0.15s; transform: rotate(' + (open ? 180 : 0) + 'deg)';
    const children = [['catalogo', 'Catálogo'], ['categorias', 'Categorías'], ['precios', 'Precios'], ['importar', 'Importar']].map(([id, label]) => {
      const on = st.child === id;
      return {
        label, active: on, current: on ? 'page' : 'false', cls: on ? '' : 'nav-i',
        pick: (e) => { e.preventDefault(); this.setState({ child: id }); },
        style: 'display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 9999px; text-decoration: none; font-size: 14px; ' + (on ? 'background: #ffffff; color: #1c1c1e; font-weight: 600; box-shadow: 0 1px 2px rgba(28,28,30,0.05), 0 6px 16px rgba(28,28,30,0.06)' : 'color: #45484d; font-weight: 500')
      };
    });
    const parent = Object.assign(mkItem('productos', 'Productos'), {
      isParent: true, isLeaf: false, open: st.prodOpen, aria: st.prodOpen ? 'true' : 'false', chev: chev(st.prodOpen), children,
      iconColor: '#d92d25',
      style: itemBase + 'background: transparent; color: #1c1c1e; font-weight: 600',
      toggle: () => this.setState({ prodOpen: !st.prodOpen })
    });
    const leaf = (it) => Object.assign(it, { isParent: false, isLeaf: true });
    const B = [
      ['menu', 'MENÚ', [leaf(mkItem('panel', 'Panel')), leaf(mkItem('ventas', 'Ventas', false, '12', 'count')), parent, leaf(mkItem('inventario', 'Inventario', false, '3', 'alert'))]],
      ['gestion', 'GESTIÓN', [leaf(mkItem('clientes', 'Clientes')), leaf(mkItem('promos', 'Promociones', false, 'NUEVO', 'nuevo')), leaf(mkItem('reportes', 'Reportes'))]],
      ['config', 'CONFIGURACIÓN', [leaf(mkItem('ajustes', 'Ajustes')), leaf(mkItem('ayuda', 'Ayuda'))]]
    ];
    const secB = B.map(([id, label, items]) => {
      const open = !!st.secs[id];
      return {
        label, items, open, aria: open ? 'true' : 'false', chev: chev(open), showHidden: !open, count: items.length + ' ocultos',
        toggle: () => this.setState({ secs: Object.assign({}, st.secs, { [id]: !open }) })
      };
    });
    const R = [['panel', 'Panel', true], ['ventas', 'Ventas', false, true], ['productos', 'Productos'], ['inventario', 'Inventario, 3 alertas', false, true, false, true], ['clientes', 'Clientes', false, false, true], ['promos', 'Promociones'], ['reportes', 'Reportes'], ['ajustes', 'Ajustes', false, false, true], ['ayuda', 'Ayuda']];
    const rail = R.map(([key, label, active, dot, divider, hover]) => ({
      label, d1: I[key][0], d2: I[key][1], d3: I[key][2], current: active ? 'page' : 'false', hasDot: !!dot, divider: !!divider,
      cls: active ? '' : 'nav-i',
      style: 'position: relative; width: 52px; height: 52px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; ' + (active ? 'background: #ffffff; color: #d92d25; box-shadow: 0 1px 2px rgba(28,28,30,0.05), 0 6px 16px rgba(28,28,30,0.07)' : hover ? 'background: #eceef1; color: #1c1c1e' : 'color: #45484d')
    }));
    const anatomy = [
      { t: 'Título de sección', d: 'Overline 11 px, mayúsculas, gris. Separa grupos de 2 a 5 opciones.' },
      { t: 'Opción', d: 'Alto 44 px, icono 19 px + texto 14 px. Hover gris #ECEEF1.' },
      { t: 'Opción activa', d: 'Píldora blanca con sombra suave, icono rojo y punto rojo. aria-current="page".' },
      { t: 'Insignias', d: 'Rojo sólido = nuevos (12). Rosa = alertas (3). Amarillo = "NUEVO" (función nueva).' },
      { t: 'Submenú', d: 'Un solo nivel. Hijos sangrados 36 px con guía vertical gris. El padre no navega, solo abre.' },
      { t: 'Sección plegable', d: 'El título es un botón con flecha; plegada muestra cuántas opciones oculta.' },
      { t: 'Colapsado', d: 'Riel de 84 px solo con iconos, divisores entre secciones y tooltip con el nombre al pasar.' }
    ];
    return { secA, secB, rail, anatomy };
  }
}
</script>
</body>
</html>
